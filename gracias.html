  <title>Gracias | Unai Ayora</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .thanks { min-height:100vh; display:grid; place-items:center; padding:40px; text-align:center; }

    .thanks-card h1 { font-size:clamp(42px,7vw,78px); margin:0 0 18px; }
    .thanks-card p { color:rgba(255,255,255,.72); line-height:1.7; margin:0 0 30px; }
    .thanks-card a { display:inline-flex; padding:14px 22px; border:1px solid rgba(224,201,147,.5); border-radius:999px; color:#fff; }
  </style>
</head>
<body>
  <main class="thanks">
    <section class="thanks-card">
      <p>UNAI AYORA · FINANZAS &amp; PATRIMONIO</p>

      <p>He recibido tu mensaje. Te responderé personalmente lo antes posible.</p>
